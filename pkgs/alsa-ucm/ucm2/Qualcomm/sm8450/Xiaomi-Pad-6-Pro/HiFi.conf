# Xiaomi Pad 6 Pro protected speakers. No hardware volume mixer is exported.
# Older kernels lack the calibration lifecycle gate and remain hard-muted.
# New kernels verify this tablet's calibration at DSP startup and refuse
# Main AMP enable without calibrated Protection DSP output.
# Digital913 (+12 dB full scale) + Analog18 (+18.5 dB): A46 user A/B on the
# native root confirmed this is the expected Android-class loudness, with the
# calibrated Protection DSP still acting as the excursion limiter. The
# earlier 673 (-18 dB) incremental step measured 1/3-1/4 of Android loudness.
# With physical RX slots 0/1, swap DSP inputs on TR/BR to match stock mapping.
# The PCM carrier has four slots, but the four amps consume only slots 0/1.
# Keep the known front-channel subset visible while the speaker protection
# firmware and four-channel route remain gated.

SectionVerb {
	EnableSequence [
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 1,0"
	]
	DisableSequence [
		cset "name='TERTIARY_TDM_RX_0 Audio Mixer MultiMedia1' 0,0"
	]
	# The capture frontend must be routable with only the verb set.  PipeWire's
	# ACP probes a UCM profile by setting the verb and opening the mapping PCMs
	# *without* ever running a device EnableSequence (alsa-ucm.c,
	# ucm_probe_profile_set), and a DPCM capture frontend with no enabled
	# backend fails that open with -EINVAL.  That drops the whole HiFi profile
	# and leaves the card with only off/pro-audio, so the session shows Dummy
	# Output and no source until something restarts WirePlumber.  Keep this in
	# the verb next to the playback mixer it mirrors; the guard keeps the verb
	# working on a kernel without the capture topology.
	If.capture_present {
		Condition {
			Type ControlExists
			Control "name='ADC1_MIXER Switch'"
		}
		True.EnableSequence [
			cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		]
		False.EnableSequence []
	}
	If.capture_gone {
		Condition {
			Type ControlExists
			Control "name='ADC1_MIXER Switch'"
		}
		True.DisableSequence [
			cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		]
		False.DisableSequence []
	}
	Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='TL Digital PCM Volume' 0"
		cset "name='TR Digital PCM Volume' 0"
		cset "name='BL Digital PCM Volume' 0"
		cset "name='BR Digital PCM Volume' 0"
		cset "name='TL Analog PCM Volume' 0"
		cset "name='TR Analog PCM Volume' 0"
		cset "name='BL Analog PCM Volume' 0"
		cset "name='BR Analog PCM Volume' 0"
	]
	DisableSequence [
		cset "name='TL Digital PCM Volume' 0"
		cset "name='TR Digital PCM Volume' 0"
		cset "name='BL Digital PCM Volume' 0"
		cset "name='BR Digital PCM Volume' 0"
		cset "name='TL Analog PCM Volume' 0"
		cset "name='TR Analog PCM Volume' 0"
		cset "name='BL Analog PCM Volume' 0"
		cset "name='BR Analog PCM Volume' 0"
	]
	If.protection_owner {
		Condition {
			Type ControlExists
			Control "name='BL Speaker Calibration Loaded'"
		}
		True.EnableSequence [
			cset "name='TL DSP1 Preload Switch' 1"
			cset "name='TR DSP1 Preload Switch' 1"
			cset "name='BL DSP1 Preload Switch' 1"
			cset "name='BR DSP1 Preload Switch' 1"
			cset "name='TL DSP RX1 Source' ASPRX1"
			cset "name='TL DSP RX2 Source' ASPRX2"
			cset "name='TL PCM Soft Ramp' 4ms"
			cset "name='TL PCM Source' DSP"
			cset "name='TR DSP RX1 Source' ASPRX2"
			cset "name='TR DSP RX2 Source' ASPRX1"
			cset "name='TR PCM Soft Ramp' 4ms"
			cset "name='TR PCM Source' DSP"
			cset "name='BL DSP RX1 Source' ASPRX1"
			cset "name='BL DSP RX2 Source' ASPRX2"
			cset "name='BL PCM Soft Ramp' 4ms"
			cset "name='BL PCM Source' DSP"
			cset "name='BR DSP RX1 Source' ASPRX2"
			cset "name='BR DSP RX2 Source' ASPRX1"
			cset "name='BR PCM Soft Ramp' 4ms"
			cset "name='BR PCM Source' DSP"
			cset "name='TL Analog PCM Volume' 18"
			cset "name='TR Analog PCM Volume' 18"
			cset "name='BL Analog PCM Volume' 18"
			cset "name='BR Analog PCM Volume' 18"
			cset "name='TL Digital PCM Volume' 913"
			cset "name='TR Digital PCM Volume' 913"
			cset "name='BL Digital PCM Volume' 913"
			cset "name='BR Digital PCM Volume' 913"
		]
	}
	Value {
		PlaybackChannels 4
		PlaybackChannel0 0
		PlaybackChannelPos0 FL
		PlaybackChannel1 1
		PlaybackChannelPos1 FR
		PlaybackRate 48000
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# The onboard microphone is AMIC1 -> WCD938x ADC1 -> SoundWire TX slave
# port1/ch0 -> TX macro SWR_INPUT0 (SWR_MIC0) -> DEC0 -> TX_AIF1 ->
# TX_CODEC_DMA_TX_3.  Three details are not free choices:
#
# DEC0: the mainline AudioReach codec-DMA config (audioreach.c,
# PARAM_ID_CODEC_DMA_INTF_CFG) sets active_channels_mask = (1 << channels) - 1
# and the sm8450 machine driver fixes the backend at two channels, so the ADSP
# reads codec-DMA channels 0 and 1 only (TX macro DEC0/DEC1).  The vendor's
# amic1 path uses DEC2, which mainline never reads.
#
# SWR_MIC0: mainline pins ADC1 to SoundWire master port1/channel0
# (wcd938x_sdw_tx_ch_info with qcom,tx-port-mapping <1 1 2 3>), exposed as TX
# SWR_INPUT0.  The vendor's SWR_MIC4 needs an "ADC1 ChMap" override mainline
# does not have.
#
# TX0 MODE=ADC_NORMAL pairs the WCD with the controller's fixed 9.6 MHz
# SoundWire clock; DEC0 MODE=ADC_DEFAULT is its matching decimator mode.
#
# The whole sequence is guarded on the capture chain existing, and the
# CapturePCM is the topology's MultiMedia2 Capture frontend (pcm_id 1); the
# PCM device number comes from the DSP topology, not from the DAI link order.
SectionDevice."Mic" {
	Comment "Onboard microphone"

	If.capture_present {
		Condition {
			Type ControlExists
			Control "name='ADC1_MIXER Switch'"
		}
		True.EnableSequence [
			cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
			cset "name='ADC1_MIXER Switch' 1"
			cset "name='ADC1 Switch' 1"
			cset "name='ADC1 Volume' 8"
			cset "name='TX0 MODE' ADC_NORMAL"
			cset "name='TX DEC0 MUX' SWR_MIC"
			cset "name='TX SMIC MUX0' SWR_MIC0"
			cset "name='DEC0 MODE' ADC_DEFAULT"
			cset "name='TX_DEC0 Volume' 102"
			cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		]
		False.EnableSequence []
	}
	If.capture_gone {
		Condition {
			Type ControlExists
			Control "name='ADC1_MIXER Switch'"
		}
		True.DisableSequence [
			cset "name='TX_AIF1_CAP Mixer DEC0' 0"
			cset "name='TX SMIC MUX0' ZERO"
			cset "name='TX0 MODE' ADC_INVALID"
			cset "name='ADC1_MIXER Switch' 0"
			cset "name='ADC1 Switch' 0"
			cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		]
		False.DisableSequence []
	}
	Value {
		CaptureChannels 2
		CaptureChannel0 0
		CaptureChannelPos0 FL
		CaptureChannel1 1
		CaptureChannelPos1 FR
		CapturePriority 100
		CaptureRate 48000
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC1"
	}
}
