Syntax 4
#
# UCM entry point for the Xiaomi Pad 6 Pro (liuqin), SM8475 / sm8450-sndcard.
#
# How this file is found -- the whole point of its name and its directory.
# alsa-lib reads ucm2/ucm.conf, and for a card that has a hw device the first
# probed path ("confd1") is
#
#	ucm2/conf.d/${CardDriver}/${CardLongName}.conf
#
# with a second try at conf.d/${CardDriver}/${CardDriver}.conf.  Both halves
# are pinned by the kernel, not guessed:
#
#   CardDriver   = "sm8450".  sound/soc/qcom/sc8280xp.c sets
#                  card->driver_name = of_device_get_match_data(dev), and the
#                  match table entry for "qcom,sm8450-sndcard" carries the
#                  string "sm8450".  soc-core.c __soc_setup_card_name() copies
#                  card->driver_name into snd_card->driver verbatim (it only
#                  rewrites non-alphanumerics, and there are none).
#   CardLongName = "Xiaomi-Pad-6-Pro".  The same helper sets snd_card->longname
#                  from card->long_name ?: card->name, unsanitised, and
#                  card->name comes from the sound node's
#                  model = "Xiaomi-Pad-6-Pro" in
#                  arch/arm64/boot/dts/qcom/sm8475-xiaomi-liuqin.dts.
#
# The card id ("XiaomiPad6Pro", what ${CardId} expands to and what
# /proc/asound/card0/id shows) is derived from the shortname and is NOT part of
# the lookup; only the driver and the long name are.  So this file must stay at
# conf.d/sm8450/Xiaomi-Pad-6-Pro.conf even though nothing else in the tree
# spells the model that way.
#
# ---------------------------------------------------------------------------
# SAFETY -- read before editing.
#
# The four CS35L41 amplifiers have not yet had their Halo protection
# calibration written (docs/AUDIO_SENSORS_PLAN.zh-CN.md 5.5).  Until that
# happens, playing anything at an unrestricted level can cook the speakers.
# Every gain this profile touches is therefore driven to mute or to its
# minimum, and no mixer element is exported to PipeWire, so PipeWire uses a
# software volume and cannot walk a hardware gain up.  The first sound is a
# deliberate, separate operation: tools/liuqin-audio-first-sound.sh.
#
# Do not add PlaybackMixerElem / PlaybackVolume here before calibration lands.
# ---------------------------------------------------------------------------

Comment "Xiaomi Pad 6 Pro (liuqin) -- quad CS35L41 on tertiary TDM"

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8450/Xiaomi-Pad-6-Pro/HiFi.conf"
	Comment "HiFi quality Music."
}

# Deliberately no BootSequence, and deliberately no
# Include.card-init.File "/lib/card-init.conf" / ctl-remap.
#
# A BootSequence runs while snd_use_case_mgr_open() is still deciding whether
# this profile applies at all, and a single cset naming a control that turns
# out not to exist fails the open -- which would drop PipeWire back to the
# Dummy Output this profile exists to replace.  Every control name below is
# read out of the mainline driver rather than guessed, but they are still
# unverified against this board, so the muting lives in the Speaker device's
# guarded EnableSequence and, authoritatively, in
# tools/liuqin-audio-ucm-apply.sh, which asserts the read-back itself.
